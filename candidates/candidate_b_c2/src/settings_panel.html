<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌宠设置</title>
<style>
  :root {
    --bg: #f4f7fc;
    --card: #ffffff;
    --text: #1d2430;
    --text-dim: #6b7688;
    --line: #e3e9f2;
    --accent: #3f8cff;
    --accent-soft: #eaf2ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  #panel { padding: 0 16px 14px 16px; }
  .drag-space { height: 28px; -webkit-app-region: drag; }
  h1 { font-size: 15px; margin: 0 0 12px 0; font-weight: 600; letter-spacing: .3px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row + .row { margin-top: 10px; }
  .label { font-size: 13px; }
  .desc { font-size: 11px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }
  .value { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

  /* 分段选择器 */
  .seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--text-dim);
    font-size: 12px; padding: 4px 0; border-radius: 6px; cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

  /* 开关 */
  .switch { position: relative; width: 40px; height: 23px; flex: 0 0 40px; -webkit-app-region: no-drag; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .slider {
    position: absolute; inset: 0; background: #cfd7e3; border-radius: 23px;
    transition: background .18s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; height: 19px; width: 19px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: transform .18s;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(17px); }
  .switch input:disabled + .slider { background: #dfe4ec; cursor: not-allowed; }

  /* 大小滑块 */
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 150px; height: 4px;
    background: var(--line); border-radius: 3px; outline: none; -webkit-app-region: no-drag;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }

  /* 心情 */
  .mood-head { display: flex; align-items: center; gap: 8px; }
  .mood-dot { width: 9px; height: 9px; border-radius: 50%; background: #9fb0c6; }
  .mood-name { font-size: 14px; font-weight: 600; }
  .energy { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .energy > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .mood-note { font-size: 11px; color: var(--text-dim); margin-top: 7px; line-height: 1.45; }

  .foot { font-size: 10.5px; color: var(--text-dim); text-align: center; margin-top: 2px; }
  .status { font-size: 11px; color: var(--accent); min-height: 15px; margin-top: 4px; text-align: center; }
</style>
</head>
<body>
<div id="panel">
  <div class="drag-space"></div>

  <h1>桌宠设置</h1>

  <div class="card">
    <div class="row">
      <div>
        <div class="label">桌宠大小</div>
        <div class="desc">缩放桌宠本体与窗口</div>
      </div>
      <input type="range" id="scale" min="60" max="160" step="5" value="100" />
      <div class="value" id="scaleValue">100%</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="label">自主活动频率</div>
        <div class="desc">她多久自己动一次</div>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="seg" id="activityRate">
        <button data-v="low">低</button>
        <button data-v="normal">正常</button>
        <button data-v="high">高</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="label">睡眠频率</div>
        <div class="desc">她多久困一次、想睡多久</div>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="seg" id="sleepRate">
        <button data-v="low">低</button>
        <button data-v="normal">正常</button>
        <button data-v="high">高</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="label">点击反馈</div>
        <div class="desc">关掉后点击不再有动作回应</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="clickFeedback" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="label">开机自动启动</div>
        <div class="desc" id="loginDesc">开机后自动在桌面出现</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="launchAtLogin" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="mood-head">
      <span class="mood-dot" id="moodDot"></span>
      <span class="mood-name" id="moodName">平静</span>
    </div>
    <div class="energy"><i id="energyBar"></i></div>
    <div class="mood-note" id="moodNote">心情由本地规则算出（互动多 → 开心，久没人理 → 无聊，深夜或久不睡 → 困倦）。</div>
  </div>

  <div class="status" id="status"></div>
  <div class="foot">设置与心情只保存在这台电脑，不联网、不上传。</div>
</div>
<script src="settings_panel.js"></script>
</body>
</html>
