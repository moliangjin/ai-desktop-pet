<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>R67 Control Panel (R82 button y position fix)</title>
<style>
  body { margin: 0; padding: 8px; font: 12px monospace; background: #f5f5f5; height: 100%; box-sizing: border-box; }
  h3 { margin: 0 0 4px 0; font-size: 12px; }
  .row { display: flex; gap: 4px; align-items: center; margin: 4px 0; }
  button {
    background: #2960c4; color: white; border: 0; border-radius: 3px;
    padding: 4px 8px; cursor: pointer; font: 11px monospace; font-weight: bold;
    flex: 0 0 auto;
  }
  button.active { background: #ffd24a; color: black; }
  .status { font: 10px monospace; background: #1a1a1a; color: #d0d0d0; padding: 4px; border-radius: 3px; margin-top: 4px; }
  .status .ok  { color: #6ee787; }
  .status .bad { color: #ff6b6b; }
</style>
</head>
<body>
<h3>R67 Control Panel</h3>
<div class="row">
  <button data-mode="A">A</button>
  <button data-mode="B">B</button>
  <button data-mode="C1">C1</button>
  <button data-mode="C2">C2</button>
</div>
<div class="status" id="status">READY</div>
<div class="status" id="counters">TEST: 0  PROBE: 0  TRANS: 0  IGNORE: false</div>
<script>
  // R71: Electron renderer has no `window.electron` global. Use the
  // require() bridge (nodeIntegration=true, contextIsolation=false).
  const { ipcRenderer } = require('electron');

  const status = document.getElementById('status');
  const counters = document.getElementById('counters');
  function setMode(m) {
    ipcRenderer.send('set-mode', m);
  }
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      setMode(btn.dataset.mode);
    });
  });
  ipcRenderer.on('mode-changed', (_e, info) => {
    document.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === info.mode);
    });
    status.innerHTML = `Mode: <span class="${info.ignore ? 'bad' : 'ok'}">${info.mode}</span>  ignore=${info.ignore}`;
  });
  ipcRenderer.on('r67_get_state', (_e, s) => {
    counters.textContent = `TEST: ${s.top_clicks}  PROBE: ${s.under_clicks}  TRANS: ${s.transitions}  IGNORE: ${s.ignore}`;
  });
  setInterval(() => {
    // R86: 'send' + 'on' (renderer 主动, main 接收) — 替代 invoke (需 'handle')
    ipcRenderer.send('r67_get_state_request', Date.now());
  }, 500);

  // R81/R82: 上报控制面板 4 个按钮的真实屏幕矩形 (小写键名, 与 orchestrator 一致)
  function reportControlButtons() {
    const sx = window.screenX || 0, sy = window.screenY || 0;
    const map = {};
    document.querySelectorAll('button[data-mode]').forEach(b => {
      const r = b.getBoundingClientRect();
      map[b.dataset.mode] = {
        x: Math.round(sx + r.left),
        y: Math.round(sy + r.top),
        w: Math.round(r.width),
        h: Math.round(r.height),
      };
    });
    ipcRenderer.send('control-buttons', map);
  }
  setTimeout(reportControlButtons, 200);
  setTimeout(reportControlButtons, 800);
  setInterval(reportControlButtons, 500);
  window.addEventListener('resize', reportControlButtons);
</script>
</body>
</html>
