<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Probe — underlay click counter</title>
<style>
  body { margin: 0; padding: 8px; font: 13px monospace; background: white; }
  h3 { margin: 4px 0; }
  #counter { font-size: 36px; font-weight: bold; color: blue; margin: 12px 0; }
</style>
</head>
<body>
<h3>Probe (underlay)</h3>
<p style="margin: 4px 0">Click on the gold ball center (sprite), then click on
the corner area (transparent). The counter below should increment whenever
alpha=0 click successfully forwards from the front window.</p>
<div id="counter">Clicks: 0</div>
<script>
  let n = 0;
  document.addEventListener('click', () => {
    n++;
    document.getElementById('counter').textContent = 'Clicks: ' + n;
    document.title = `probe: underlay-clicks=${n}`;
  });
</script>
</body>
</html>
