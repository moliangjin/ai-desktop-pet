<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>R67 Underlay Probe</title>
<style>
  body { margin: 0; padding: 12px; font: 13px monospace; background: white; }
  h3 { margin: 4px 0; }
  #counter { font-size: 30px; font-weight: bold; color: blue; margin: 8px 0; }
  button {
    background: #1a73e8; color: white; border: 0; border-radius: 4px;
    padding: 10px 20px; cursor: pointer; font: 14px monospace; font-weight: bold;
  }
  #log { font-size: 11px; max-height: 70px; overflow-y: auto; border: 1px solid #ccc; padding: 4px; }
</style>
</head>
<body>
<h3>R67 Probe (underlay)</h3>
<p style="margin: 4px 0; color: #555">Clicks forwarded through the transparent top window increment this counter.</p>
<div id="counter">Clicks: 0</div>
<button id="probe-btn">Probe Button (click directly)</button>
<div id="log"></div>
<script>
  // R71 fix: Electron renderer has no `window.electron` global. Use the
  // require() bridge (nodeIntegration=true, contextIsolation=false in
  // the BrowserWindow config).
  const { ipcRenderer } = require('electron');

  let n = 0;
  function bump(x, y) {
    n++;
    document.getElementById('counter').textContent = 'Clicks: ' + n;
    document.title = 'probe: under-clicks=' + n;
    const row = document.createElement('div');
    row.textContent = '#' + n + ' at (' + Math.round(x) + ',' + Math.round(y) + ')';
    document.getElementById('log').appendChild(row);
    ipcRenderer.send('under-click', { x, y });
  }
  document.getElementById('probe-btn').addEventListener('click', (ev) => {
    bump(ev.clientX, ev.clientY);
  });
  document.addEventListener('click', (ev) => {
    bump(ev.clientX, ev.clientY);
  });

  // R71: report probe button screen rect to main so the Swift runner
  // can pick a guaranteed-overlap transparent test point.
  function reportProbeButton() {
    const btn = document.getElementById('probe-btn');
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    const sx = window.screenX || 0;
    const sy = window.screenY || 0;
    ipcRenderer.send('probe-button-rect', {
      x: Math.round(sx + r.left),
      y: Math.round(sy + r.top),
      w: Math.round(r.width),
      h: Math.round(r.height),
    });
  }
  ipcRenderer.send('probe-ready', { ready: true });
  setTimeout(reportProbeButton, 200);
  setTimeout(reportProbeButton, 800);
  setInterval(reportProbeButton, 500);
  window.addEventListener('resize', reportProbeButton);
</script>
</body>
</html>
